name: Render Backend Keep-Alive

permissions:
  contents: read

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier 15-minute inactivity spin down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          echo "Pinging Disheera Render backend endpoints at $(date)..."
          HTTP_STATUS_CUSTOM=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://api.disheera.site/health" || echo "000")
          HTTP_STATUS_RENDER=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://careerpath-ai-bdbt.onrender.com/api/health" || echo "000")
          echo "api.disheera.site status: $HTTP_STATUS_CUSTOM"
          echo "onrender.com status: $HTTP_STATUS_RENDER"
          if [ "$HTTP_STATUS_CUSTOM" -eq 200 ] || [ "$HTTP_STATUS_RENDER" -eq 200 ]; then
            echo "✅ Backend is awake, healthy, and ready for instant responses!"
          else
            echo "⚠️ Backend responded with unexpected status (waking up, will retry next interval)"
          fi
