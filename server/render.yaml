# ============================================================
# Disheera — Render Blueprint Deployment Specification
# Dual-Engine Architecture: Persistent Real-Time & Worker Service
# ============================================================

services:
  - type: web
    name: disheera-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Render automatically assigns PORT dynamically.
      # The server code automatically reads process.env.PORT.
      - key: PORT
        value: 10000

      - key: SERVER_ROLE
        value: realtime-worker

      - key: UV_THREADPOOL_SIZE
        value: 64

      - key: JWT_EXPIRES_IN
        value: 7d

      # Supabase PostgreSQL Database (Transaction Pooler & Direct)
      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      # Optional Media Storage & API Keys
      - key: CLOUDINARY_URL
        sync: false

      # Email Delivery Configuration (Gmail SMTP / Custom)
      - key: SMTP_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

      # Set this to your deployed Vercel frontend URL, e.g. https://disheera.site
      - key: CLIENT_URL
        value: https://disheera.site
      - key: PROD_CLIENT_URL
        value: https://disheera.site
