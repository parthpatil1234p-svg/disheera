# ============================================================
# Disheera — Render Blueprint Deployment Specification
# Tier 2: Dedicated Persistent Real-Time & Heavy Computation Worker
# ============================================================

services:
  - type: web
    name: disheera-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Render automatically assigns PORT dynamically.
      # The server code automatically reads process.env.PORT.
      - key: PORT
        value: 10000

      - key: SERVER_ROLE
        value: realtime-worker

      - key: PERSISTENT_WORKER
        value: "true"

      - key: ENABLE_CRON_WORKER
        value: "true"

      - key: UV_THREADPOOL_SIZE
        value: 64

      - key: JWT_EXPIRES_IN
        value: 7d

      # Supabase PostgreSQL Database (Transaction Pooler & Direct)
      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: ADMIN_JWT_SECRET
        sync: false

      # Optional Media Storage & API Keys
      - key: CLOUDINARY_URL
        sync: false

      # Dual-Engine AI Keys for Heavy Workloads (Groq & Gemini)
      - key: GROQ_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      # Email Delivery Configuration (Dakly Engine API / SMTP)
      - key: DAKLY_API_URL
        value: https://dakly-engin.vercel.app/api/send

      - key: DAKLY_API_KEY
        sync: false

      - key: SMTP_PORT
        value: 587

      - key: EMAIL_USER
        sync: false

      - key: EMAIL_PASS
        sync: false

      # Frontend Origins & Reverse Proxy Allowlist
      - key: CLIENT_URL
        value: https://disheera.site

      - key: PROD_CLIENT_URL
        value: https://disheera.site

      - key: ALLOWED_ORIGINS
        value: https://disheera.site,https://www.disheera.site,https://admin.disheera.site
